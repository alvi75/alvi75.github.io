  <style>
      body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%) !important; color: #e8e8e8 !important; }
      #navbar { background: rgba(20, 20, 20, 0.95) !important; backdrop-filter: blur(10px) !important; border-bottom: 1px solid rgba(251, 191, 36, 0.1) !important; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5) !important; }
      .nav-link, .navbar .nav-link { color: #fbbf24 !important; transition: all 0.3s ease !important; }
      .nav-link:hover { color: hsl(46, 97%, 65%) !important; }
      .nav-link.active, .nav-item.navbar-active .nav-link { color: #fcd34d !important; font-weight: 700 !important; }
      a { color: #fbbf24 !important; }
      a:hover { color: #fcd34d !important; }
      h1, h2, h3, h4, h5, h6 { color: #ffffff !important; font-weight: 700 !important; }
      .navbar-brand.title { color: #fbbf24 !important; font-weight: 400 !important; }
      .navbar-brand.title .font-weight-bold { color: #fbbf24 !important; font-weight: 700 !important; }

      /* Blog cards — same style as project cards */
      .blog-card {
        width: 100%;
        max-width: 680px;
        margin-bottom: 20px;
      }

      .blog-card a {
        text-decoration: none;
        color: inherit;
      }

      .blog-card .card {
        background-color: rgba(30, 30, 30, 0.6) !important;
        border: 1px solid rgba(251, 191, 36, 0.15) !important;
        border-radius: 4px;
        overflow: hidden;
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .blog-card .card:hover {
        background-color: rgba(40, 40, 40, 0.7) !important;
        border-color: rgba(251, 191, 36, 0.3) !important;
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .blog-card .card-header {
        background-color: transparent !important;
        border-bottom: 1px solid rgba(251, 191, 36, 0.1) !important;
        padding: 8px 12px !important;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .blog-card .card-header-icon {
        font-size: 24px;
        color: #9333ea;
      }

      .blog-card .card-header-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .blog-card .card-header-title {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff !important;
        margin: 0;
      }

      .blog-card .card-header-subtitle {
        font-size: 11px;
        color: #999 !important;
        margin: 0;
      }

      .blog-card .card-body {
        padding: 10px 12px 8px 12px !important;
        background-color: transparent !important;
        display: flex;
        flex-direction: column;
      }

      .blog-card h5.card-title {
        font-size: 15px !important;
        font-weight: 600 !important;
        color: #ffffff !important;
        margin-bottom: 5px !important;
        background-color: transparent !important;
        line-height: 1.25;
      }

      .blog-card .card-text {
        font-size: 12px !important;
        color: #999 !important;
        line-height: 1.35 !important;
        margin-bottom: 6px !important;
        background-color: transparent !important;
      }

      .blog-card .card-meta {
        font-size: 11px;
        color: #777 !important;
        margin-bottom: 8px;
      }

      .blog-card .read-btn {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: #3b82f6 !important;
        transition: all 0.3s ease;
        padding: 0;
        background: none;
        border: none;
      }

      .blog-card .read-btn:hover {
        color: #60a5fa !important;
      }
  </style>

  <!-- Scrolling Progress Bar -->
  <script type="text/javascript">
    $(document).ready(function() {
      var navbarHeight = $('#navbar').outerHeight(true);
      $('body').css({ 'padding-top': navbarHeight });
      $('progress-container').css({ 'padding-top': navbarHeight });
      var progressBar = $('#progress');
      progressBar.css({ 'top': navbarHeight });
      var getMax = function() { return $(document).height() - $(window).height(); }
      var getValue = function() { return $(window).scrollTop(); }
      if ('max' in document.createElement('progress')) {
        progressBar.attr({ max: getMax() });
        progressBar.attr({ value: getValue() });
        $(document).on('scroll', function() {
          progressBar.attr({ value: getValue() });
        });
        $(window).resize(function() {
          var navbarHeight = $('#navbar').outerHeight(true);
          $('body').css({ 'padding-top': navbarHeight });
          $('progress-container').css({ 'padding-top': navbarHeight });
          progressBar.css({ 'top': navbarHeight });
          progressBar.attr({ max: getMax(), value: getValue() });
        });
      } else {
        var max = getMax(), value, width;
        var getWidth = function() {
          value = getValue();
          width = (value/max) * 100;
          width = width + '%';
          return width;
        }
        var setWidth = function() { progressBar.css({ width: getWidth() }); };
        setWidth();
        $(document).on('scroll', setWidth);
        $(window).on('resize', function() {
          max = getMax();
          setWidth();
        });
      }
    });
  </script>

  <!-- Load Blog Posts from blog.json -->
  <script type="text/javascript">
    $(document).ready(function() {
      $.getJSON('/blog.json', function(posts) {
        var container = $('#blog-posts');
        posts.forEach(function(post) {
          var card = '<div class="blog-card">' +
            '<a href="/' + post.link + '">' +
              '<div class="card">' +
                '<div class="card-header">' +
                  '<i class="fas fa-pen-nib card-header-icon"></i>' +
                  '<div class="card-header-text">' +
                    '<p class="card-header-title">' + post.title + '</p>' +
                    '<p class="card-header-subtitle">' + post.date + '</p>' +
                  '</div>' +
                '</div>' +
                '<div class="card-body">' +
                  '<p class="card-text">' + post.description + '</p>' +
                  '<span class="read-btn">Read &rarr;</span>' +
                '</div>' +
              '</div>' +
            '</a>' +
          '</div>';
          container.append(card);
        });
      });
    });
  </script>
